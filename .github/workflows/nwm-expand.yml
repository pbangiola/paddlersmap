name: Expand verified NWM connections
on:
  schedule:
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      seed_offset:
        description: 'Starting seed offset; blank rotates daily across available windows'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: expand-nwm-connections
  cancel-in-progress: false
jobs:
  expand:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - uses: actions/cache@v4
        with:
          path: |
            local/output/nwm-connections/reaches
            local/output/nwm-connected-geometry
          key: nwm-connected-${{ github.run_id }}
          restore-keys: nwm-connected-
      - name: Extend a bounded window of published reach links
        env:
          SEED_OFFSET: ${{ inputs.seed_offset }}
        run: |
          if [ -z "$SEED_OFFSET" ]; then
            SEED_OFFSET=$(python -c 'import json; from datetime import datetime,timezone; n=json.load(open("web/nwm/gauges/assignments.json")).get("coverage",{}).get("seed_total",1500); print((int(datetime.now(timezone.utc).timestamp())//86400%max(1,(n+499)//500))*500)')
          fi
          python -u scripts/nwm/connections.py --seed-offset "$SEED_OFFSET" --seed-limit 500 --max-requests 2000 --max-depth 300 --max-seconds 900 --max-gauges 5000
      - name: Cache actual geometry of newly confirmed paths
        run: python -u scripts/nwm/connected_geometry.py
      - name: Publish verified map data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/nwm/gauges
          if ! git diff --cached --quiet; then
            git commit -m "Expand verified NWM connections and colors"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy-pages.yml --ref main
          fi
