name: Review national named canoe launch inventory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: named-canoe-launch-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: local/output/canonical-launches
          key: named-canoe-${{ github.run_id }}
          restore-keys: named-canoe-
      - name: Retrieve complete national inventory and reconcile curated sources
        run: python scripts/nwm/launch_inventory.py --retrieve
      - name: Upload inventory and coverage for review (never commit partial output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-launch-review
          path: |
            web/nwm/launches/
            docs/nwm/launch-reconciliation.json
            local/output/canonical-launches/
