name: Review national named canoe launch inventory
on:
  workflow_dispatch:
    inputs:
      resume_run:
        description: Optional prior run ID containing raw checkpoints
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: named-canoe-launch-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: local/output/canonical-launches
          key: named-canoe-${{ github.run_id }}
          restore-keys: named-canoe-
      - name: Resume raw checkpoints from a prior review artifact
        if: inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
          gh run download "$RESUME_RUN" --name canonical-launch-review --dir /tmp/launch-resume
          mkdir -p local/output/canonical-launches
          cp -a /tmp/launch-resume/local/output/canonical-launches/. local/output/canonical-launches/
      - name: Retrieve complete national inventory and reconcile curated sources
        run: python scripts/nwm/launch_inventory.py --retrieve
      - name: Upload inventory and coverage for review (never commit partial output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-launch-review
          path: |
            web/nwm/launches/
            docs/nwm/launch-reconciliation.json
            local/output/canonical-launches/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: local/output/canonical-launches
          key: named-canoe-${{ github.run_id }}
