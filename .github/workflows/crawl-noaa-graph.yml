name: NATIONAL - Crawl ordered NOAA gauge connection graph
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/crawl_noaa_graph.py"
      - ".github/workflows/crawl-noaa-graph.yml"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: noaa-graph-data
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-live
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl and publish next NOAA batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u app-code/scripts/crawl_noaa_graph.py --batch 25 --delay 0.3 --max-seconds 3000 --publish
