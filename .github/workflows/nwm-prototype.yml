name: NWM prototype tests
on:
  pull_request:
    paths:
      - 'web/nwm/**'
      - 'scripts/nwm/**'
      - 'scripts/test_nwm_*.py'
      - '.github/workflows/named-canoe-launches.yml'
      - '.github/workflows/nwm-observations.yml'
      - '.github/workflows/nwm-overview.yml'
      - 'docs/nwm/connection-validation/browser.json'
      - 'nwm-prototype.html'
      - 'index.html'
      - 'about.html'
      - 'gauge-connections.html'
      - '.github/workflows/nwm-expand.yml'
      - '.github/workflows/nwm-prototype.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-offline.txt -r requirements-watershed.txt pyproj numpy ijson
      - run: node --test web/nwm/*.test.mjs
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
