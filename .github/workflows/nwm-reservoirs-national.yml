name: Expand and refresh national NWM waterbodies
on:
  schedule:
    - cron: '45 * * * *'
    - cron: '5 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Expand static coverage or refresh cached flow values only
        type: choice
        options: [expand, refresh]
        default: expand
      cell:
        description: Optional discovery cell, for example conus_-123_40
        type: string
        default: ''
      max_waterbodies:
        description: Maximum waterbodies per bounded expansion run (1–100)
        type: number
        default: 32
      routing_budget:
        description: Maximum new NWPS routing lookups (1–1000)
        type: number
        default: 800
      publish:
        description: Commit reviewed map outputs and dispatch Pages (false uploads review artifacts only)
        type: boolean
        default: true
permissions:
  contents: write
  actions: write
concurrency:
  group: national-reservoir-data
  cancel-in-progress: false
jobs:
  national:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests 'shapely>=2,<3'
      - uses: actions/cache/restore@v4
        with:
          path: local/output/nwm-national-reservoirs
          key: nwm-national-reservoir-v1-${{ github.run_id }}
          restore-keys: nwm-national-reservoir-v1-
      - name: Run bounded all-order discovery or geometry-free flow refresh
        env:
          REQUEST_MODE: ${{ inputs.mode }}
          CELL: ${{ inputs.cell }}
          MAX_WATERBODIES: ${{ inputs.max_waterbodies }}
          ROUTING_BUDGET: ${{ inputs.routing_budget }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="${REQUEST_MODE:-expand}"
          if [ "$SCHEDULE" = '5 6 * * *' ]; then MODE=refresh; fi
          ARGS=(--mode "$MODE" --max-waterbodies "${MAX_WATERBODIES:-32}" --routing-budget "${ROUTING_BUDGET:-800}" --max-depth 50 --seconds 1200)
          if [ -n "$CELL" ]; then ARGS+=(--cell "$CELL"); fi
          python -u scripts/nwm/national_reservoirs.py "${ARGS[@]}"
      - name: Save progress, source errors and reviewable map outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-waterbody-review
          retention-days: 7
          path: |
            web/nwm/reservoirs/national/
      - name: Save static source checkpoints even after a partial failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: local/output/nwm-national-reservoirs
          key: nwm-national-reservoir-v1-${{ github.run_id }}
      - name: Publish map outputs (main only)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/nwm/reservoirs/national
          if ! git diff --cached --quiet; then
            git commit -m "Expand or refresh national NWM waterbody coverage"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run deploy-pages.yml --ref main
          fi
