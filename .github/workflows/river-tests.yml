name: MANUAL - Legacy river identity tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'shapely>=2,<3' pyproj lxml
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
