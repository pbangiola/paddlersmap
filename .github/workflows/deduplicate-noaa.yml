name: "MAINTENANCE - Audit and deduplicate NOAA live GeoJSON"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deduplicate-noaa.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-live
          fetch-depth: 0
          sparse-checkout: |
            data/noaa_gauges.geojson
            data/noaa_graph_edges.geojson
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app-code
          sparse-checkout: scripts/deduplicate_noaa.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit and deduplicate
        run: |
          python app-code/scripts/deduplicate_noaa.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noaa_gauges.geojson data/noaa_graph_edges.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Deduplicate NOAA gauges and segments preserving unique records"
            git pull --rebase origin data-live
            git push origin HEAD:data-live
          fi
