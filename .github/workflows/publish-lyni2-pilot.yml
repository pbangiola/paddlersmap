name: "PILOT - Publish Des Plaines to Illinois gauge graph"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lyni2-pilot.yml'
      - 'scripts/publish_lyni2_pilot.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-live
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pilot and update data-live
        run: |
          python app-code/scripts/publish_lyni2_pilot.py --max-stations 50
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noaa_gauges.geojson data/noaa_graph_edges.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Publish LYNI2 ordered gauge pilot with stage colors"
            git pull --rebase origin data-live
            git push origin HEAD:data-live
          fi
