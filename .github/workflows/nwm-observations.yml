name: Refresh verified NWM endpoint observations
on:
  schedule:
    - cron: '39 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-nwm-observations
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh only endpoints of confirmed paths
        run: python -u scripts/nwm/connections.py --observations-only
      - name: Commit prototype observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/nwm/gauges/observations.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified NWM endpoint observations"
            git pull --rebase origin main
            git push origin HEAD:main
            # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
            gh workflow run deploy-pages.yml --ref main
          fi
